appId: com.faratech.flick
productName: Flick
compression: maximum
directories:
  output: release
publish:
  provider: github
  releaseType: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target: nsis
  icon: public/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flick
  artifactName: Flick-Setup-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  icon: public/icon.png
  category: Network;Chat
  maintainer: Faratech <boboyaga78@gmail.com>
  description: Flick - Secure Encrypted Chat
  artifactName: Flick-${version}.${ext}
deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - nss
