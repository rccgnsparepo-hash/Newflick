appId: com.faratech.flick
productName: Flick
compression: maximum
directories:
  output: release
protocols:
  - name: Flick Deep Link Protocol
    schemes:
      - flick
      - faraflick
publish:
  provider: github
  releaseType: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target: nsis
  icon: public/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flick
  artifactName: Flick-Setup-${version}.${ext}
linux:
  target:
    - deb
    - AppImage
  icon: public/icon.png
  category: Network;Chat;InstantMessaging
  maintainer: Faratech <boboyaga78@gmail.com>
  synopsis: Flick - Secure Encrypted Chat & Social
  description: "Flick encrypted communication and social platform with native push notifications, calls, and offline sync."
  desktop:
    Name: Flick
    Comment: Flick Secure Chat & Social Platform
    Categories: Network;Chat;InstantMessaging;
    StartupNotify: "true"
    MimeType: x-scheme-handler/flick;x-scheme-handler/faraflick;
  artifactName: Flick-${version}.${ext}
deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - nss

