<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flick // Node Disconnected</title>
  <style>
    body {
      background-color: #050505;
      color: #39ff14;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-transform: uppercase;
    }
    .container {
      max-width: 600px;
      border: 1px solid #39ff14;
      padding: 2rem;
      background-color: #000;
      box-shadow: 10px 10px 0px #1a1a1a;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 1px solid #39ff14;
      padding-bottom: 1rem;
      margin-top: 0;
      letter-spacing: 2px;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #a0f0a0;
    }
    .status-badge {
      display: inline-block;
      background-color: #ff0055;
      color: #fff;
      padding: 0.25rem 0.5rem;
      font-weight: bold;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    .retry-btn {
      display: inline-block;
      background-color: #39ff14;
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1.5rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-badge">STATUS: OFFLINE</div>
    <h1>Fara Flick // Secure Node Offline</h1>
    <p>Your terminal has lost physical connection consensus with the end-to-end encrypted spectrum mesh.</p>
    <p>The local sandbox is preserving cryptographic key state. Verify hardware network parameters, and request handshake re-evaluation.</p>
    <button class="retry-btn" onclick="window.location.reload()">Re-establish Handshake</button>
  </div>
</body>
</html>
