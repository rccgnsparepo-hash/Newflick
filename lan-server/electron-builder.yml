appId: com.faratech.flick.lanserver
productName: Flick LAN Server
copyright: Copyright © 2026 Flick Network

directories:
  output: release
  buildResources: build

files:
  - "dist/**/*"
  - "package.json"

asar: true

extraResources:
  - from: "src/dashboard"
    to: "dashboard"

# Windows Configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: ../public/icon.png
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flick LAN Server
  artifactName: Flick-LAN-Server-Setup-${version}-${arch}.${ext}
  uninstallDisplayName: Flick LAN Server

# macOS Configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  icon: ../public/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Flick LAN Server ${version}
  artifactName: Flick-LAN-Server-macOS-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux Configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Utility
  icon: ../public/icon.png
  synopsis: Flick Offline-First School LAN Infrastructure Server
  description: Realtime local network backend for Flick communication clients.

deb:
  artifactName: flick-lan-server_${version}_${arch}.deb
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libnss3
    - libxss1

appImage:
  artifactName: Flick-LAN-Server-${version}-${arch}.AppImage
