appId: com.faratech.flick.lanserver
productName: Flick LAN Server
copyright: Copyright © 2026 Flick Network
electronVersion: 34.0.0

directories:
  output: release

files:
  - "dist/**/*"
  - "package.json"

asar: true

extraResources:
  - from: "src/dashboard"
    to: "dashboard"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: ../public/icon.png
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flick LAN Server
  artifactName: Flick-LAN-Server-Setup-${version}.${ext}
  uninstallDisplayName: Flick LAN Server

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  icon: ../public/icon.png

dmg:
  title: Flick LAN Server ${version}
  artifactName: Flick-LAN-Server-macOS-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Utility
  icon: ../public/icon.png
  maintainer: Faratech <boboyaga78@gmail.com>
  synopsis: Flick Offline-First School LAN Infrastructure Server
  artifactName: Flick-LAN-Server-${version}.${ext}

deb:
  artifactName: flick-lan-server_${version}_amd64.deb
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libnss3
    - libxss1

appImage:
  artifactName: Flick-LAN-Server-${version}-x86_64.AppImage
