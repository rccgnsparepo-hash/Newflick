name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret is not set, push notifications may not work."
          fi

      - name: Generate App Icons & Android Mipmaps
        run: node scripts/generate-android-icons.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          gradle assembleDebug --stacktrace

      - name: Stage APK with Release Version Name
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Flick-Android-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flick-android-apk-v1.0.${{ github.run_number }}
          path: release-apk/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: "Flick Android APK v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Flick Android Release v1.0.${{ github.run_number }}
            
            #### ⚡ Push Notification & Audio Enhancements:
            - **Android 13+ Notification Permissions (`POST_NOTIFICATIONS`)**: Full native runtime permission dialog integration and channel registration.
            - **OneSignal & FCM Synchronization**: Auto-binds user tokens to Firestore on sign-in and ensures background wakeups even when closed.
            - **Native Push Diagnostics Suite**: In-app audit tool to verify permissions, device subscription IDs, and Firestore token alignment with auto-repair.
            - **Deep Link Navigation**: Instant routing on notification clicks (`flick://`, `faraflick://`) directly to specific chats, groups, and call rooms.
            - **Microphone & Voice Permission Engine**: Standardized audio permission handler with real-time hardware diagnostics and loopback testing.
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

