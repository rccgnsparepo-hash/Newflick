name: Build & Release Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inject Repository Info
        shell: bash
        run: |
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"

      - name: Install Dependencies
        shell: bash
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Bump Version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Generate and Push Git Tag
        id: tag
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          git tag $TAG_NAME || true
          git push origin $TAG_NAME || true

      - name: Convert Icon for Electron
        shell: bash
        run: node scripts/build-icon.js || true

      - name: Build Web App
        run: npm run build

      - name: Build Electron Executable
        run: npx electron-builder --win -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flick-windows-v1.0.${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Flick Windows Desktop v1.0.${{ github.run_number }}"
          body: |
            ### 🪟 Flick Windows Desktop Release v1.0.${{ github.run_number }}
            
            #### ⚡ Notification & Audio Upgrades:
            - **Native Windows Toast Notifications**: Integrated with action buttons and system tray alert indicators.
            - **Deep Linking Protocol**: Support for `flick://` and `faraflick://` URLs directly opening specific conversations or video rooms.
            - **App Badge Counter**: Unread counter synchronization with Windows taskbar badge.
            - **Microphone & WebRTC Media Diagnostics**: Hardware checks, permissions, and audio loopback meters.
          files: release/*.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
