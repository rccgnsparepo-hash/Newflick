name: Build & Release Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inject Repository Info
        run: |
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Bump Version
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version

      - name: Convert Icon for Electron
        run: node scripts/build-icon.js

      - name: Build Web App
        run: npm run build

      - name: Build and Publish Electron Executable
        run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
